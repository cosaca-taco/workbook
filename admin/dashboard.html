<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>えなまなびのもり｜先生ダッシュボード</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --amber:#EF9F27;--amber-d:#C97E10;--amber-l:#FAEEDA;
      --green:#2D7A4F;--green-l:#E1F5EE;
      --red:#E24B4A;--red-l:#FCEBEB;
      --blue:#2563EB;--blue-l:#EFF6FF;
      --purple:#7C3AED;--purple-l:#F5F3FF;
      --bg:#F8F7F4;--card:#FFFFFF;--border:#E0D8CC;
      --text:#1A1208;--muted:#8A7A60;--shadow:0 2px 8px rgba(0,0,0,.07);
    }
    body{font-family:'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

    /* レイアウト */
    .layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
    .sidebar{background:#1A1208;color:#fff;padding:1.25rem 1rem;display:flex;flex-direction:column;gap:.75rem}
    .sidebar-logo{font-size:15px;font-weight:700;padding-bottom:1rem;border-bottom:1px solid rgba(255,255,255,.12);line-height:1.4}
    .sidebar-logo span{font-size:11px;opacity:.6;display:block;margin-top:2px}
    .nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;color:rgba(255,255,255,.7);font-size:13px;cursor:pointer;text-decoration:none;transition:background .15s}
    .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
    .nav-item.active{background:var(--amber);color:#3D2000;font-weight:700}
    .nav-icon{font-size:16px;width:20px;text-align:center}
    .sidebar-section{font-size:11px;opacity:.4;padding:8px 12px 4px;font-weight:700;letter-spacing:.05em}
    .sidebar-footer{margin-top:auto;font-size:11px;opacity:.45;line-height:1.6}
    .btn-logout{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);border:none;border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;width:100%;text-align:left;margin-top:4px}
    .btn-logout:hover{background:rgba(255,255,255,.15);color:#fff}

    .main{padding:1.5rem;overflow-y:auto}
    .page{display:none}.page.active{display:block}

    /* ヘッダー */
    .page-header{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
    .page-title{font-size:20px;font-weight:700}
    .page-sub{font-size:13px;color:var(--muted);margin-top:2px}
    .header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
    .teacher-badge{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--border);padding:5px 10px;border-radius:8px}

    /* サマリーカード */
    .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
    .summary-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1.25rem;box-shadow:var(--shadow)}
    .sc-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
    .sc-value{font-size:28px;font-weight:700;line-height:1}
    .sc-sub{font-size:11px;color:var(--muted);margin-top:4px}
    .sc-icon{font-size:24px;margin-bottom:6px}

    /* 共通カード */
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.25rem;box-shadow:var(--shadow);margin-bottom:1rem}
    .card-title{font-size:14px;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:6px}

    /* テーブル */
    .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:1rem}
    table{width:100%;border-collapse:collapse}
    th{background:#F5F1EB;padding:10px 14px;text-align:left;font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
    td{padding:11px 14px;border-bottom:1px solid #F5F1EB;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr.clickable:hover td{background:#FAFAF8;cursor:pointer}
    .empty{text-align:center;padding:2.5rem;color:var(--muted);font-size:13px}

    /* バッジ */
    .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
    .badge-green{background:var(--green-l);color:var(--green)}
    .badge-amber{background:var(--amber-l);color:var(--amber-d)}
    .badge-red{background:var(--red-l);color:var(--red)}
    .badge-blue{background:var(--blue-l);color:var(--blue)}
    .badge-gray{background:#F0EDE8;color:var(--muted)}

    /* スコアバー */
    .score-bar-wrap{display:flex;align-items:center;gap:8px}
    .score-bar{flex:1;height:6px;background:#EEE;border-radius:3px;overflow:hidden;min-width:60px}
    .score-bar-fill{height:100%;border-radius:3px}
    .score-num{font-size:12px;font-weight:700;width:32px;text-align:right;flex-shrink:0}

    /* 詳細ドロワー */
    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;backdrop-filter:blur(2px)}
    .drawer-overlay.active{display:block}
    .drawer{position:fixed;right:0;top:0;bottom:0;width:440px;background:var(--card);box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:101;overflow-y:auto;padding:1.5rem;transform:translateX(100%);transition:transform .25s ease}
    .drawer.active{transform:translateX(0)}
    .drawer-header{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
    .drawer-title{font-size:17px;font-weight:700}
    .drawer-close{margin-left:auto;background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:6px}
    .drawer-close:hover{background:var(--bg)}
    .drawer-section{margin-bottom:1.25rem}
    .drawer-section-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:.75rem;padding-bottom:4px;border-bottom:1px solid #F0EDE8}
    .unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .unit-mini{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
    .unit-mini-name{font-size:12px;font-weight:700;margin-bottom:4px}
    .unit-mini-stars{font-size:13px;margin-bottom:4px}
    .unit-mini-score{font-size:11px;color:var(--muted)}
    .session-item{padding:10px 0;border-bottom:1px solid #F5F1EB;display:flex;align-items:flex-start;gap:10px}
    .session-item:last-child{border-bottom:none}
    .session-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
    .session-info{flex:1}
    .session-title{font-size:13px;font-weight:700;margin-bottom:2px}
    .session-meta{font-size:11px;color:var(--muted)}
    .session-score{font-size:13px;font-weight:700;flex-shrink:0}

    /* ローディング */
    .loading{display:flex;align-items:center;justify-content:center;height:200px;gap:10px;color:var(--muted)}
    .spinner{width:28px;height:28px;border:3px solid var(--amber-l);border-top-color:var(--amber);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ログイン */
    .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
    .login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:360px;text-align:center;box-shadow:var(--shadow)}
    .login-logo{font-size:44px;margin-bottom:8px}
    .login-title{font-size:20px;font-weight:700;margin-bottom:4px}
    .login-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
    .login-input{width:100%;padding:11px;font-size:15px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:10px;outline:none;font-family:inherit;background:var(--bg)}
    .login-input:focus{border-color:var(--amber)}
    .login-btn{width:100%;padding:13px;font-size:15px;font-weight:700;background:var(--amber);color:#3D2000;border:none;border-radius:12px;cursor:pointer;box-shadow:0 3px 0 var(--amber-d)}
    .login-err{font-size:13px;color:var(--red);margin-top:8px;min-height:18px}

    /* フッター */
    .site-footer{text-align:center;padding:1rem;font-size:11px;color:var(--muted);border-top:1px solid var(--border);margin-top:1rem}
  </style>
</head>
<body>

<!-- ログイン画面 -->
<div id="loginPage">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">🦉</div>
      <div class="login-title">えなまなびのもり</div>
      <div class="login-sub">先生用・ダッシュボード</div>
      <input id="emailInput"    class="login-input" type="email"    placeholder="メールアドレス"/>
      <input id="passwordInput" class="login-input" type="password" placeholder="パスワード"/>
      <button id="loginBtn" class="login-btn">ログイン</button>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>
</div>

<!-- ダッシュボード本体 -->
<div id="dashboardPage" style="display:none">
  <div class="layout">

    <!-- サイドバー -->
    <div class="sidebar">
      <div class="sidebar-logo">
        🌳 えなまなびのもり
        <span>先生ダッシュボード</span>
      </div>
      <div class="sidebar-section">メニュー</div>
      <div class="nav-item active" data-page="overview">
        <span class="nav-icon">📊</span>クラス概要
      </div>
      <div class="nav-item" data-page="students">
        <span class="nav-icon">👦</span>生徒一覧
      </div>
      <div class="nav-item" data-page="units">
        <span class="nav-icon">📚</span>単元別集計
      </div>
      <div class="sidebar-section">管理</div>
      <a class="nav-item" href="./index.html">
        <span class="nav-icon">✏️</span>問題管理
      </a>
      <div style="margin-top:auto">
        <div class="sidebar-footer" id="teacherInfo"></div>
        <button class="btn-logout" id="logoutBtn">ログアウト</button>
      </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="main">

      <!-- クラス概要ページ -->
      <div id="page-overview" class="page active">
        <div class="page-header">
          <div>
            <div class="page-title">📊 クラス概要</div>
            <div class="page-sub" id="overviewDate"></div>
          </div>
          <div class="header-right">
            <button class="login-btn" style="width:auto;padding:8px 16px;font-size:13px" onclick="loadAll()">🔄 更新</button>
          </div>
        </div>
        <div class="summary-grid" id="summaryGrid">
          <div class="loading"><div class="spinner"></div></div>
        </div>
        <div class="card">
          <div class="card-title">📈 最近の学習（直近7日間）</div>
          <div id="recentActivity"><div class="loading"><div class="spinner"></div></div></div>
        </div>
      </div>

      <!-- 生徒一覧ページ -->
      <div id="page-students" class="page">
        <div class="page-header">
          <div>
            <div class="page-title">👦 生徒一覧</div>
            <div class="page-sub">クリックすると詳細が表示されます</div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>なまえ</th>
                <th>最終学習日</th>
                <th>クリア数</th>
                <th>平均理解度</th>
                <th>学習回数</th>
              </tr>
            </thead>
            <tbody id="studentTable">
              <tr><td colspan="5"><div class="loading"><div class="spinner"></div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 単元別集計ページ -->
      <div id="page-units" class="page">
        <div class="page-header">
          <div>
            <div class="page-title">📚 単元別集計</div>
            <div class="page-sub">全生徒の単元ごとの平均理解度スコア</div>
          </div>
        </div>
        <div id="unitStats"><div class="loading"><div class="spinner"></div></div></div>
      </div>

      <footer class="site-footer">v1.0.0 © 2025 @ena-gifu.com All rights reserved.</footer>
    </div>
  </div>
</div>

<!-- 生徒詳細ドロワー -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-title" id="drawerTitle"></div>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div id="drawerContent"></div>
</div>

<script type="module">
import {
  auth, signInTeacher, signOutUser,
  getAllUsers, getUserSessions
} from "../firebase.js";

/* ============================================================
   定数
============================================================ */
const UNITS = [
  {id:'add', name:'たし算の筆算'}, {id:'sub', name:'ひき算の筆算'},
  {id:'num', name:'1000までの数'}, {id:'len', name:'長さ'},
  {id:'vol', name:'かさ'},         {id:'time',name:'時こくと時間'},
  {id:'mul', name:'かけ算（九九）'},{id:'shape',name:'三角形と四角形'},
];
const STAGES = [1,2,3];

/* ============================================================
   状態
============================================================ */
let allUsers = [], allSessions = {};

/* ============================================================
   ユーティリティ
============================================================ */
function scoreColor(s) {
  if(s>=80) return 'var(--green)';
  if(s>=60) return 'var(--blue)';
  if(s>=40) return 'var(--amber)';
  return 'var(--red)';
}
function scoreBadgeClass(s) {
  if(s>=80) return 'badge-green';
  if(s>=60) return 'badge-blue';
  if(s>=40) return 'badge-amber';
  return 'badge-red';
}
function formatDate(ts) {
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('ja-JP', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function formatDateShort(ts) {
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('ja-JP', {month:'numeric',day:'numeric'});
}
function daysSince(ts) {
  if(!ts) return 999;
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return Math.floor((Date.now()-d.getTime())/86400000);
}
function totalCleared(progress) {
  let n=0;
  Object.values(progress||{}).forEach(u=>{
    Object.values(u).forEach(s=>{ if(s.cleared) n++; });
  });
  return n;
}
function avgUnderstanding(sessions) {
  if(!sessions||sessions.length===0) return null;
  const scores = sessions.map(s=>s.understandingScore).filter(s=>s!=null);
  if(scores.length===0) return null;
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}

/* ============================================================
   ログイン
============================================================ */
document.getElementById('loginBtn').addEventListener('click', async()=>{
  const email    = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const err      = document.getElementById('loginErr');
  if(!email||!password){err.textContent='メールアドレスとパスワードを入力してください';return;}
  err.textContent='ログイン中…';
  const user = await signInTeacher(email, password);
  if(!user){err.textContent='メールアドレスまたはパスワードが違います';return;}
  document.getElementById('teacherInfo').textContent=user.email;
  document.getElementById('loginPage').style.display='none';
  document.getElementById('dashboardPage').style.display='block';
  document.getElementById('overviewDate').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});
  await loadAll();
});
document.getElementById('passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click();});

document.getElementById('logoutBtn').addEventListener('click', async()=>{
  await signOutUser();
  document.getElementById('dashboardPage').style.display='none';
  document.getElementById('loginPage').style.display='block';
  document.getElementById('emailInput').value='';
  document.getElementById('passwordInput').value='';
  document.getElementById('loginErr').textContent='';
});

/* ============================================================
   ナビゲーション
============================================================ */
document.querySelectorAll('.nav-item[data-page]').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+el.dataset.page).classList.add('active');
  });
});

/* ============================================================
   データ読み込み
============================================================ */
async function loadAll() {
  allUsers = await getAllUsers();
  /* 全ユーザーのセッションを並列取得 */
  const results = await Promise.all(
    allUsers.map(u => getUserSessions(u.uid, 50))
  );
  allUsers.forEach((u, i) => { allSessions[u.uid] = results[i]; });

  renderOverview();
  renderStudentTable();
  renderUnitStats();
}

/* ============================================================
   クラス概要
============================================================ */
function renderOverview() {
  const total      = allUsers.length;
  const today      = new Date().toDateString();
  const activeToday= allUsers.filter(u=>{
    if(!u.updatedAt) return false;
    const d = u.updatedAt.toDate ? u.updatedAt.toDate() : new Date(u.updatedAt);
    return d.toDateString()===today;
  }).length;
  const allScores  = Object.values(allSessions).flat().map(s=>s.understandingScore).filter(s=>s!=null);
  const avgScore   = allScores.length ? Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length) : 0;
  const totalSess  = Object.values(allSessions).flat().length;

  document.getElementById('summaryGrid').innerHTML=`
    <div class="summary-card">
      <div class="sc-icon">👦</div>
      <div class="sc-label">登録生徒数</div>
      <div class="sc-value" style="color:var(--blue)">${total}</div>
      <div class="sc-sub">人</div>
    </div>
    <div class="summary-card">
      <div class="sc-icon">📅</div>
      <div class="sc-label">本日学習した生徒</div>
      <div class="sc-value" style="color:var(--green)">${activeToday}</div>
      <div class="sc-sub">人</div>
    </div>
    <div class="summary-card">
      <div class="sc-icon">📊</div>
      <div class="sc-label">全体平均理解度</div>
      <div class="sc-value" style="color:${scoreColor(avgScore)}">${avgScore||'—'}</div>
      <div class="sc-sub">${avgScore?'点':''}</div>
    </div>
    <div class="summary-card">
      <div class="sc-icon">✏️</div>
      <div class="sc-label">総学習回数</div>
      <div class="sc-value" style="color:var(--amber)">${totalSess}</div>
      <div class="sc-sub">回</div>
    </div>`;

  /* 最近7日の学習履歴 */
  const days = 7;
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
  const recent = Object.values(allSessions).flat()
    .filter(s => {
      if(!s.createdAt) return false;
      const d = s.createdAt.toDate ? s.createdAt.toDate() : new Date(s.createdAt);
      return d > cutoff;
    })
    .sort((a,b)=>{
      const da = a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt);
      const db2= b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt);
      return db2-da;
    })
    .slice(0,15);

  if(recent.length===0){
    document.getElementById('recentActivity').innerHTML='<div class="empty">直近7日間の学習記録がありません</div>';
    return;
  }

  /* uidからnameを引くマップ */
  const nameMap = {};
  allUsers.forEach(u=>nameMap[u.uid]=u.name);

  /* 全セッションにuidを付与しておく */
  Object.entries(allSessions).forEach(([uid,sessions])=>{
    sessions.forEach(s=>{ if(!s._uid) s._uid=uid; });
  });

  document.getElementById('recentActivity').innerHTML=`
    <table style="width:100%;border-collapse:collapse">
      <thead>
        <tr>
          <th style="padding:8px 12px;text-align:left;font-size:12px;font-weight:700;color:var(--muted);background:#F5F1EB;border-bottom:1px solid var(--border)">日時</th>
          <th style="padding:8px 12px;text-align:left;font-size:12px;font-weight:700;color:var(--muted);background:#F5F1EB;border-bottom:1px solid var(--border)">生徒</th>
          <th style="padding:8px 12px;text-align:left;font-size:12px;font-weight:700;color:var(--muted);background:#F5F1EB;border-bottom:1px solid var(--border)">単元・ステージ</th>
          <th style="padding:8px 12px;text-align:left;font-size:12px;font-weight:700;color:var(--muted);background:#F5F1EB;border-bottom:1px solid var(--border)">理解度</th>
          <th style="padding:8px 12px;text-align:left;font-size:12px;font-weight:700;color:var(--muted);background:#F5F1EB;border-bottom:1px solid var(--border)">結果</th>
        </tr>
      </thead>
      <tbody>
        ${recent.map(s=>{
          const name = nameMap[s._uid] || '—';
          const score= s.understandingScore||0;
          return`<tr>
            <td style="padding:9px 12px;border-bottom:1px solid #F5F1EB;font-size:12px;color:var(--muted)">${formatDate(s.createdAt)}</td>
            <td style="padding:9px 12px;border-bottom:1px solid #F5F1EB;font-weight:700">${name}</td>
            <td style="padding:9px 12px;border-bottom:1px solid #F5F1EB;font-size:13px">${s.unitName||s.unitId} ST${s.stageId}</td>
            <td style="padding:9px 12px;border-bottom:1px solid #F5F1EB">
              <span class="badge ${scoreBadgeClass(score)}">${score}点</span>
            </td>
            <td style="padding:9px 12px;border-bottom:1px solid #F5F1EB">
              <span class="badge ${s.cleared?'badge-green':'badge-gray'}">${s.cleared?'✅ クリア':'未クリア'}</span>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

/* ============================================================
   生徒一覧
============================================================ */
function renderStudentTable() {
  const tbody = document.getElementById('studentTable');
  if(allUsers.length===0){
    tbody.innerHTML='<tr><td colspan="5"><div class="empty">生徒データがありません</div></td></tr>';
    return;
  }

  const rows = allUsers.map(u=>{
    const sessions  = allSessions[u.uid]||[];
    const cleared   = totalCleared(u.progress);
    const avg       = avgUnderstanding(sessions);
    const days      = daysSince(u.updatedAt);
    const lastLabel = days===0?'今日':days===1?'昨日':days<7?`${days}日前`:days<30?`${Math.floor(days/7)}週間前`:'1ヶ月以上前';
    const freshness = days===0?'badge-green':days<3?'badge-amber':'badge-gray';
    return {u, sessions, cleared, avg, days, lastLabel, freshness};
  }).sort((a,b)=>a.days-b.days);

  tbody.innerHTML = rows.map(({u,sessions,cleared,avg,lastLabel,freshness})=>`
    <tr class="clickable" data-uid="${u.uid}">
      <td><strong>${u.name||'—'}</strong></td>
      <td><span class="badge ${freshness}">${lastLabel}</span></td>
      <td>${cleared} <span style="font-size:11px;color:var(--muted)">/ 24ステージ</span></td>
      <td>
        ${avg!=null?`
          <div class="score-bar-wrap">
            <div class="score-bar"><div class="score-bar-fill" style="width:${avg}%;background:${scoreColor(avg)}"></div></div>
            <div class="score-num" style="color:${scoreColor(avg)}">${avg}</div>
          </div>`:
          '<span style="font-size:11px;color:var(--muted)">データなし</span>'}
      </td>
      <td>${sessions.length} <span style="font-size:11px;color:var(--muted)">回</span></td>
    </tr>`).join('');

  /* 行クリック → ドロワー */
  tbody.querySelectorAll('tr.clickable').forEach(tr=>{
    tr.addEventListener('click',()=>openDrawer(tr.dataset.uid));
  });
}

/* ============================================================
   単元別集計
============================================================ */
function renderUnitStats() {
  const allSess = Object.values(allSessions).flat();
  const el = document.getElementById('unitStats');
  if(allSess.length===0){
    el.innerHTML='<div class="empty">学習データがありません</div>';
    return;
  }

  const unitData = UNITS.map(u=>{
    const uSessions = allSess.filter(s=>s.unitId===u.id);
    const scores    = uSessions.map(s=>s.understandingScore).filter(s=>s!=null);
    const avg       = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
    const clearCount= uSessions.filter(s=>s.cleared).length;
    const playerSet = new Set(uSessions.map(s=>s._uid).filter(Boolean));
    return { ...u, avg, count:uSessions.length, clearCount, players:playerSet.size };
  });

  el.innerHTML=`
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>単元</th>
            <th>平均理解度</th>
            <th>学習回数</th>
            <th>クリア回数</th>
            <th>学習した生徒数</th>
          </tr>
        </thead>
        <tbody>
          ${unitData.map(u=>`
            <tr>
              <td><strong>${u.name}</strong></td>
              <td>
                ${u.avg!=null?`
                  <div class="score-bar-wrap">
                    <div class="score-bar"><div class="score-bar-fill" style="width:${u.avg}%;background:${scoreColor(u.avg)}"></div></div>
                    <div class="score-num" style="color:${scoreColor(u.avg)}">${u.avg}</div>
                  </div>`:
                  '<span style="font-size:11px;color:var(--muted)">データなし</span>'}
              </td>
              <td>${u.count}回</td>
              <td>${u.clearCount}回</td>
              <td>${u.players}人</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

/* ============================================================
   生徒詳細ドロワー
============================================================ */
function openDrawer(uid) {
  const user     = allUsers.find(u=>u.uid===uid);
  const sessions = allSessions[uid]||[];
  if(!user) return;

  document.getElementById('drawerTitle').textContent=`${user.name} さんの詳細`;

  /* 単元別進捗 */
  const unitHTML = UNITS.map(u=>{
    const p   = (user.progress||{})[u.id]||{};
    const cleared = [1,2,3].filter(s=>(p[`s${s}`]||{}).cleared);
    const bestScores = [1,2,3].map(s=>(p[`s${s}`]||{}).bestUnderstandingScore||0);
    const bestUs  = Math.max(...bestScores);
    const stars   = '⭐'.repeat(cleared.length)+'☆'.repeat(3-cleared.length);
    return`<div class="unit-mini">
      <div class="unit-mini-name">${u.name}</div>
      <div class="unit-mini-stars">${stars}</div>
      <div class="unit-mini-score">${bestUs>0?`最高:${bestUs}点`:'未学習'}</div>
    </div>`;
  }).join('');

  /* 最近のセッション */
  const sessHTML = sessions.slice(0,10).map(s=>{
    const score = s.understandingScore||0;
    const d = s.createdAt?.toDate ? s.createdAt.toDate() : new Date(s.createdAt||0);
    return`<div class="session-item">
      <div class="session-dot" style="background:${s.cleared?'var(--green)':'var(--amber)'}"></div>
      <div class="session-info">
        <div class="session-title">${s.unitName||s.unitId} ステージ${s.stageId}</div>
        <div class="session-meta">${formatDateShort(s.createdAt)}　ヒント${s.hintCount||0}回　平均${(s.avgTimeSec||0).toFixed(1)}秒</div>
        ${s.advice?`<div style="font-size:11px;color:var(--muted);margin-top:3px;font-style:italic">「${s.advice}」</div>`:''}
      </div>
      <div class="session-score" style="color:${scoreColor(score)}">${score}点</div>
    </div>`;
  }).join('') || '<div style="color:var(--muted);font-size:13px">学習記録がありません</div>';

  /* 集計 */
  const avg     = avgUnderstanding(sessions);
  const cleared = totalCleared(user.progress);
  const days    = daysSince(user.updatedAt);

  document.getElementById('drawerContent').innerHTML=`
    <div class="drawer-section">
      <div class="drawer-section-title">サマリー</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1rem">
        <div style="background:var(--bg);border-radius:10px;padding:10px;text-align:center">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px">平均理解度</div>
          <div style="font-size:22px;font-weight:700;color:${scoreColor(avg||0)}">${avg!=null?avg+'点':'—'}</div>
        </div>
        <div style="background:var(--bg);border-radius:10px;padding:10px;text-align:center">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px">クリア数</div>
          <div style="font-size:22px;font-weight:700;color:var(--green)">${cleared}</div>
        </div>
        <div style="background:var(--bg);border-radius:10px;padding:10px;text-align:center">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px">学習回数</div>
          <div style="font-size:22px;font-weight:700;color:var(--blue)">${sessions.length}</div>
        </div>
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">単元別進捗</div>
      <div class="unit-grid">${unitHTML}</div>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">最近の学習記録</div>
      ${sessHTML}
    </div>`;

  document.getElementById('drawerOverlay').classList.add('active');
  document.getElementById('drawer').classList.add('active');
}

document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('active');
  document.getElementById('drawer').classList.remove('active');
}

/* セッションにuidを付与するための前処理 */
function attachUids() {
  Object.entries(allSessions).forEach(([uid,sessions])=>{
    sessions.forEach(s=>{ s._uid = uid; });
  });
}
const origLoadAll = loadAll;
window.loadAll = async function() {
  await origLoadAll();
  attachUids();
  renderOverview();
};
</script>
</body>
</html>
